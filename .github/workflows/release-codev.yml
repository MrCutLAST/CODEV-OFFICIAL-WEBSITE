name: Build and publish CODEV releases

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to update (use v1 for the stable channel)
        required: true
        default: v1
        type: string

permissions:
  contents: read

concurrency:
  group: codev-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-source:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      cli_version: ${{ steps.version.outputs.cli_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore encrypted source bundle
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODEV_SOURCE_KEY: ${{ secrets.CODEV_SOURCE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p encrypted-source codev-source
          # Draft releases may not have a resolvable tag ref; resolve by release ID.
          RELEASE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.tag_name == "codev-source-bundle") | .id' | head -n 1)"
          if [[ -z "$RELEASE_ID" ]]; then
            echo "::error::Encrypted source draft release codev-source-bundle is not visible to the workflow token."
            exit 1
          fi
          ASSET_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" --jq '.[] | select(.name == "Codev-source.zip.enc") | .id' | head -n 1)"
          if [[ -z "$ASSET_ID" ]]; then
            echo "::error::Encrypted source asset Codev-source.zip.enc is missing from release ${RELEASE_ID}."
            exit 1
          fi
          curl --fail --location --silent --show-error \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" \
            --output encrypted-source/Codev-source.zip.enc
          test -s encrypted-source/Codev-source.zip.enc
          node scripts/decrypt-source.mjs encrypted-source/Codev-source.zip.enc encrypted-source/Codev-source.zip
          if command -v unzip >/dev/null 2>&1; then
            unzip -q encrypted-source/Codev-source.zip -d codev-source
          else
            tar -xf encrypted-source/Codev-source.zip -C codev-source
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false
      - name: Validate source, versions, and tests
        id: version
        working-directory: codev-source
        shell: bash
        run: |
          set -euo pipefail
          required=(package.json VERSION.txt worker.js desktop/electron/main.mjs desktop/electron/electron-builder.config.cjs cli/go.mod cli/cmd/codev/main.go)
          for file in "${required[@]}"; do
            test -s "$file" || { echo "::error::Missing $file"; exit 1; }
          done
          VERSION="$(node -p "require('./package.json').version")"
          VERSION_FILE="$(tr -d '\r\n' < VERSION.txt)"
          [[ "$VERSION_FILE" == "$VERSION" ]] || { echo "::error::VERSION.txt ($VERSION_FILE) must match package.json ($VERSION)."; exit 1; }
          CLI_VERSION="$(sed -nE 's/^const version = "([^"]+)".*/\1/p' cli/cmd/codev/main.go | head -1)"
          test -n "$CLI_VERSION" || { echo "::error::Could not read CLI version"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "cli_version=$CLI_VERSION" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            [[ "$TAG_VERSION" == "$VERSION" ]] || { echo "::error::Tag v$TAG_VERSION does not match Desktop version $VERSION."; exit 1; }
          fi
          npm install --no-audit --no-fund
          npm run test:all:desktop

  build-desktop-windows:
    needs: validate-source
    runs-on: windows-latest
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore encrypted source bundle
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODEV_SOURCE_KEY: ${{ secrets.CODEV_SOURCE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p encrypted-source codev-source
          # Draft releases may not have a resolvable tag ref; resolve by release ID.
          RELEASE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.tag_name == "codev-source-bundle") | .id' | head -n 1)"
          if [[ -z "$RELEASE_ID" ]]; then
            echo "::error::Encrypted source draft release codev-source-bundle is not visible to the workflow token."
            exit 1
          fi
          ASSET_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" --jq '.[] | select(.name == "Codev-source.zip.enc") | .id' | head -n 1)"
          if [[ -z "$ASSET_ID" ]]; then
            echo "::error::Encrypted source asset Codev-source.zip.enc is missing from release ${RELEASE_ID}."
            exit 1
          fi
          curl --fail --location --silent --show-error \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" \
            --output encrypted-source/Codev-source.zip.enc
          test -s encrypted-source/Codev-source.zip.enc
          node scripts/decrypt-source.mjs encrypted-source/Codev-source.zip.enc encrypted-source/Codev-source.zip
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            powershell.exe -NoProfile -NonInteractive -Command "Expand-Archive -LiteralPath 'encrypted-source/Codev-source.zip' -DestinationPath 'codev-source' -Force"
          else
            unzip -q encrypted-source/Codev-source.zip -d codev-source
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: codev-source
        run: npm install --no-audit --no-fund
      - name: Build Windows x64 installer and portable executable
        working-directory: codev-source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $builderConfig = @'
          const path = require("node:path");
          const loaded = require(path.resolve(process.cwd(), "desktop/electron/electron-builder.config.cjs"));
          const config = typeof loaded === "function" ? loaded() : loaded;
          if (!config || typeof config !== "object") throw new Error("electron-builder config must export an object");
          module.exports = {
            ...config,
            directories: {
              ...(config.directories || {}),
              ...(process.env.CODEV_BUILD_OUTPUT ? { output: process.env.CODEV_BUILD_OUTPUT } : {})
            }
          };
          '@
          [System.IO.File]::WriteAllText(
            (Join-Path $env:RUNNER_TEMP "codev-ci-builder.cjs"),
            $builderConfig,
            (New-Object System.Text.UTF8Encoding($false))
          )
          New-Item -ItemType Directory -Force release | Out-Null
          $env:CODEV_BUILD_OUTPUT = "out/win-x64"
          npx electron-builder --win nsis portable --x64 --config "$env:RUNNER_TEMP\codev-ci-builder.cjs" --publish never
          Remove-Item Env:CODEV_BUILD_OUTPUT
          Copy-Item out/win-x64/CodevSetup.exe release/CodevSetup.exe -Force
          $portable = Get-ChildItem out/win-x64 -Filter "*win-x64.exe" | Select-Object -First 1
          if (!$portable) { throw "Windows x64 portable executable missing" }
          Copy-Item $portable.FullName release/Codev.exe -Force
          Copy-Item out/win-x64/latest.yml release/latest.yml -Force
          Get-ChildItem out/win-x64 -Filter "*.blockmap" | Copy-Item -Destination release -Force
      - name: Build Windows ARM64 installer and portable executable
        working-directory: codev-source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:CODEV_BUILD_OUTPUT = "out/win-arm64"
          npx electron-builder --win nsis portable --arm64 --config "$env:RUNNER_TEMP\codev-ci-builder.cjs" --publish never
          Remove-Item Env:CODEV_BUILD_OUTPUT
          Copy-Item out/win-arm64/CodevSetup.exe release/CodevSetup-arm64.exe -Force
          $portable = Get-ChildItem out/win-arm64 -Filter "*win-arm64.exe" | Select-Object -First 1
          if (!$portable) { throw "Windows ARM64 portable executable missing" }
          Copy-Item $portable.FullName release/Codev-arm64.exe -Force
          if (Test-Path out/win-arm64/latest.yml) {
            (Get-Content out/win-arm64/latest.yml -Raw).Replace("CodevSetup.exe", "CodevSetup-arm64.exe") | Set-Content release/latest-arm64.yml
          }
          Get-ChildItem out/win-arm64 -Filter "*.blockmap" | ForEach-Object {
            $newName = $_.Name.Replace("CodevSetup.exe", "CodevSetup-arm64.exe")
            Copy-Item $_.FullName (Join-Path release $newName) -Force
          }
      - uses: actions/upload-artifact@v4
        with:
          name: codev-desktop-windows
          path: codev-source/release/*
          if-no-files-found: error
          retention-days: 7

  build-desktop-macos:
    needs: validate-source
    runs-on: macos-15
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore encrypted source bundle
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODEV_SOURCE_KEY: ${{ secrets.CODEV_SOURCE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p encrypted-source codev-source
          # Draft releases may not have a resolvable tag ref; resolve by release ID.
          RELEASE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.tag_name == "codev-source-bundle") | .id' | head -n 1)"
          if [[ -z "$RELEASE_ID" ]]; then
            echo "::error::Encrypted source draft release codev-source-bundle is not visible to the workflow token."
            exit 1
          fi
          ASSET_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" --jq '.[] | select(.name == "Codev-source.zip.enc") | .id' | head -n 1)"
          if [[ -z "$ASSET_ID" ]]; then
            echo "::error::Encrypted source asset Codev-source.zip.enc is missing from release ${RELEASE_ID}."
            exit 1
          fi
          curl --fail --location --silent --show-error \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" \
            --output encrypted-source/Codev-source.zip.enc
          test -s encrypted-source/Codev-source.zip.enc
          node scripts/decrypt-source.mjs encrypted-source/Codev-source.zip.enc encrypted-source/Codev-source.zip
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            powershell.exe -NoProfile -NonInteractive -Command "Expand-Archive -LiteralPath 'encrypted-source/Codev-source.zip' -DestinationPath 'codev-source' -Force"
          else
            unzip -q encrypted-source/Codev-source.zip -d codev-source
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: codev-source
        run: npm install --no-audit --no-fund
      - name: Build macOS Intel and Apple Silicon installers and update archives
        working-directory: codev-source
        run: npx electron-builder --mac dmg zip --x64 --arm64 --config desktop/electron/electron-builder.config.cjs --publish never
      - name: Verify macOS outputs
        working-directory: codev-source
        run: |
          test -s release/Codev-mac-x64.dmg
          test -s release/Codev-mac-arm64.dmg
          test -s release/Codev-mac-x64.zip
          test -s release/Codev-mac-arm64.zip
          test -s release/latest-mac.yml
      - uses: actions/upload-artifact@v4
        with:
          name: codev-desktop-macos
          path: codev-source/release/*
          if-no-files-found: error
          retention-days: 7

  build-desktop-linux:
    needs: validate-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            flag: x64
            output: linux-x64
            feed: latest-linux.yml
          - runner: ubuntu-24.04-arm
            arch: arm64
            flag: arm64
            output: linux-arm64
            feed: latest-linux-arm64.yml
    runs-on: ${{ matrix.runner }}
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore encrypted source bundle
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODEV_SOURCE_KEY: ${{ secrets.CODEV_SOURCE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p encrypted-source codev-source
          # Draft releases may not have a resolvable tag ref; resolve by release ID.
          RELEASE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.tag_name == "codev-source-bundle") | .id' | head -n 1)"
          if [[ -z "$RELEASE_ID" ]]; then
            echo "::error::Encrypted source draft release codev-source-bundle is not visible to the workflow token."
            exit 1
          fi
          ASSET_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" --jq '.[] | select(.name == "Codev-source.zip.enc") | .id' | head -n 1)"
          if [[ -z "$ASSET_ID" ]]; then
            echo "::error::Encrypted source asset Codev-source.zip.enc is missing from release ${RELEASE_ID}."
            exit 1
          fi
          curl --fail --location --silent --show-error \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" \
            --output encrypted-source/Codev-source.zip.enc
          test -s encrypted-source/Codev-source.zip.enc
          node scripts/decrypt-source.mjs encrypted-source/Codev-source.zip.enc encrypted-source/Codev-source.zip
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            powershell.exe -NoProfile -NonInteractive -Command "Expand-Archive -LiteralPath 'encrypted-source/Codev-source.zip' -DestinationPath 'codev-source' -Force"
          else
            unzip -q encrypted-source/Codev-source.zip -d codev-source
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot
      - name: Install dependencies
        working-directory: codev-source
        run: npm install --no-audit --no-fund
      - name: Build Linux AppImage, DEB, and RPM (${{ matrix.arch }})
        working-directory: codev-source
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
          p.homepage = p.homepage || "https://github.com/MrCutLAST/Codev-OFFICIAL";
          fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
          NODE
          cat > "$RUNNER_TEMP/codev-ci-builder.cjs" <<'NODE'
          const path = require("node:path");
          const loaded = require(path.resolve(process.cwd(), "desktop/electron/electron-builder.config.cjs"));
          const config = typeof loaded === "function" ? loaded() : loaded;
          if (!config || typeof config !== "object") throw new Error("electron-builder config must export an object");
          module.exports = {
            ...config,
            directories: {
              ...(config.directories || {}),
              output: process.env.CODEV_BUILD_OUTPUT || (config.directories || {}).output
            },
            linux: {
              ...(config.linux || {}),
              maintainer: (config.linux || {}).maintainer || "Codev Team <247970877+MrCutLAST@users.noreply.github.com>"
            }
          };
          NODE
          CODEV_BUILD_OUTPUT="out/${{ matrix.output }}" npx electron-builder --linux AppImage deb rpm --${{ matrix.flag }} --config "$RUNNER_TEMP/codev-ci-builder.cjs" --publish never
      - name: Stage architecture-specific Linux update feed
        working-directory: codev-source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp -a out/${{ matrix.output }}/. release/
          if [[ -f "release/latest-linux.yml" && "${{ matrix.arch }}" == "arm64" ]]; then
            mv release/latest-linux.yml release/latest-linux-arm64.yml
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: codev-desktop-linux-${{ matrix.arch }}
          path: codev-source/release/*
          if-no-files-found: error
          retention-days: 7

  build-cli:
    needs: validate-source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Restore encrypted source bundle
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODEV_SOURCE_KEY: ${{ secrets.CODEV_SOURCE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p encrypted-source codev-source
          # Draft releases may not have a resolvable tag ref; resolve by release ID.
          RELEASE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.tag_name == "codev-source-bundle") | .id' | head -n 1)"
          if [[ -z "$RELEASE_ID" ]]; then
            echo "::error::Encrypted source draft release codev-source-bundle is not visible to the workflow token."
            exit 1
          fi
          ASSET_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" --jq '.[] | select(.name == "Codev-source.zip.enc") | .id' | head -n 1)"
          if [[ -z "$ASSET_ID" ]]; then
            echo "::error::Encrypted source asset Codev-source.zip.enc is missing from release ${RELEASE_ID}."
            exit 1
          fi
          curl --fail --location --silent --show-error \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" \
            --output encrypted-source/Codev-source.zip.enc
          test -s encrypted-source/Codev-source.zip.enc
          node scripts/decrypt-source.mjs encrypted-source/Codev-source.zip.enc encrypted-source/Codev-source.zip
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            powershell.exe -NoProfile -NonInteractive -Command "Expand-Archive -LiteralPath 'encrypted-source/Codev-source.zip' -DestinationPath 'codev-source' -Force"
          else
            unzip -q encrypted-source/Codev-source.zip -d codev-source
          fi
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false
      - name: Build CLI for Windows, macOS, and Linux
        working-directory: codev-source
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.validate-source.outputs.cli_version }}"
          RELEASE_TAG="${{ inputs.release_tag || github.ref_name }}"
          mkdir -p dist
          build_one() {
            local goos="$1" goarch="$2" name="$3" format="$4"
            local output="dist/$name"
            (cd cli && GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "../$output" ./cmd/codev)
            if [[ "$format" == "zip" ]]; then
              (cd dist && zip -q "${name%.exe}.zip" "$name")
            else
              (cd dist && tar -czf "$name.tar.gz" "$name")
            fi
          }
          build_one windows amd64 CodevCLI-windows-x64.exe zip
          build_one windows arm64 CodevCLI-windows-arm64.exe zip
          build_one darwin amd64 CodevCLI-macos-x64 tar
          build_one darwin arm64 CodevCLI-macos-arm64 tar
          build_one linux amd64 CodevCLI-linux-x64 tar
          build_one linux arm64 CodevCLI-linux-arm64 tar
          cp dist/CodevCLI-windows-x64.exe cli/installer/CodevCLI.exe
          (cd cli && GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ../dist/CodevCLI-Setup.exe ./installer)
          cp dist/CodevCLI-windows-x64.exe dist/CodevCLI.exe
          HASH="$(sha256sum dist/CodevCLI.exe | cut -d' ' -f1)"
          cat > dist/cli-update.json <<EOF
          {"version":"$VERSION","url":"https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/CodevCLI.exe","sha256":"$HASH","notes":"Codev CLI $VERSION (Windows x64)"}
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: codev-cli-all-platforms
          path: codev-source/dist/*
          if-no-files-found: error
          retention-days: 7

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs:
      - validate-source
      - build-desktop-windows
      - build-desktop-macos
      - build-desktop-linux
      - build-cli
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Verify release payload
        shell: bash
        run: |
          set -euo pipefail
          required=(
            CodevSetup.exe CodevSetup-arm64.exe Codev.exe Codev-arm64.exe
            Codev-mac-x64.dmg Codev-mac-arm64.dmg Codev-mac-x64.zip Codev-mac-arm64.zip
            latest.yml latest-mac.yml latest-linux.yml latest-linux-arm64.yml
            CodevCLI.exe CodevCLI-Setup.exe CodevCLI-windows-x64.zip CodevCLI-windows-arm64.zip
            CodevCLI-macos-x64.tar.gz CodevCLI-macos-arm64.tar.gz
            CodevCLI-linux-x64.tar.gz CodevCLI-linux-arm64.tar.gz cli-update.json
          )
          for file in "${required[@]}"; do
            test -s "release/$file" || { echo "::error::Missing release asset $file"; exit 1; }
          done
          compgen -G "release/Codev-linux-*.AppImage" >/dev/null || { echo "::error::Linux AppImage missing"; exit 1; }
          compgen -G "release/*.deb" >/dev/null || { echo "::error::Linux DEB missing"; exit 1; }
          compgen -G "release/*.rpm" >/dev/null || { echo "::error::Linux RPM missing"; exit 1; }
          compgen -G "release/*.blockmap" >/dev/null || { echo "::error::Windows/macOS blockmap assets missing"; exit 1; }
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: CODEV ${{ inputs.release_tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
