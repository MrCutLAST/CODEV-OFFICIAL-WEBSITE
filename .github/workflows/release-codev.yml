name: Build and publish CODEV releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit in the PRIVATE source repository
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: codev-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-source:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout PRIVATE CODEV source
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.CODEV_SOURCE_REPOSITORY }}
          ref: ${{ inputs.source_ref || 'main' }}
          token: ${{ secrets.CODEV_SOURCE_TOKEN }}
          path: codev-source
      - name: Validate source and version
        id: version
        working-directory: codev-source
        shell: bash
        run: |
          required=(
            package.json
            VERSION.txt
            worker.js
            desktop/electron/main.mjs
            desktop/electron/electron-builder.config.cjs
            cli/go.mod
            cli/cmd/codev/main.go
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "::error::Missing $file"; exit 1; }
          done
          VERSION="$(node -p "require('./package.json').version")"
          VERSION_FILE="$(tr -d '\r\n' < VERSION.txt)"
          if [[ "$VERSION_FILE" != "$VERSION" ]]; then
            echo "::error::VERSION.txt ($VERSION_FILE) must match package.json ($VERSION)."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$TAG_VERSION" != "$VERSION" ]]; then
              echo "::error::Release tag v$TAG_VERSION does not match package.json version $VERSION."
              exit 1
            fi
          fi

  build-desktop:
    needs: validate-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            script: build:win
          - os: macos-15
            platform: macos
            script: build:mac
          - os: ubuntu-24.04
            platform: linux
            script: build:linux
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout PRIVATE CODEV source
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.CODEV_SOURCE_REPOSITORY }}
          ref: ${{ inputs.source_ref || 'main' }}
          token: ${{ secrets.CODEV_SOURCE_TOKEN }}
          path: codev-source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false
      - name: Install dependencies
        working-directory: codev-source
        run: npm install
      - name: Run project validation
        working-directory: codev-source
        run: npm run test:all
      - name: Build installer with GitHub update provider
        working-directory: codev-source
        run: npm run ${{ matrix.script }} -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: codev-desktop-${{ matrix.platform }}
          path: codev-source/release/*
          if-no-files-found: error
          retention-days: 7

  build-cli-windows:
    needs: validate-source
    runs-on: windows-latest
    steps:
      - name: Checkout PRIVATE CODEV source
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.CODEV_SOURCE_REPOSITORY }}
          ref: ${{ inputs.source_ref || 'main' }}
          token: ${{ secrets.CODEV_SOURCE_TOKEN }}
          path: codev-source
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false
      - name: Build CLI and self-contained installer
        working-directory: codev-source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Push-Location cli
          New-Item -ItemType Directory -Force bin | Out-Null
          go build -trimpath -ldflags="-s -w" -o bin/CodevCLI.exe ./cmd/codev
          Copy-Item -Force bin/CodevCLI.exe installer/CodevCLI.exe
          go build -trimpath -ldflags="-s -w" -o bin/CodevCLI-Setup.exe ./installer
          Pop-Location
          Copy-Item -Force cli/bin/CodevCLI.exe CodevCLI.exe
          Copy-Item -Force cli/bin/CodevCLI-Setup.exe CodevCLI-Setup.exe
          $cliSource = Get-Content cli/cmd/codev/main.go -Raw
          $match = [regex]::Match($cliSource, 'const version = "([^"]+)"')
          if (!$match.Success) { throw "Could not read CLI version from cli/cmd/codev/main.go" }
          $cliVersion = $match.Groups[1].Value
          $hash = (Get-FileHash CodevCLI.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $releaseUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/CodevCLI.exe"
          $manifest = @{
            version = $cliVersion
            url = $releaseUrl
            sha256 = $hash
            notes = "CODEV CLI $cliVersion"
          } | ConvertTo-Json -Compress
          Set-Content -Path cli-update.json -Value $manifest -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: codev-cli-windows
          path: |
            codev-source/CodevCLI.exe
            codev-source/CodevCLI-Setup.exe
            codev-source/cli-update.json
          if-no-files-found: error
          retention-days: 7

  build-cli-linux:
    needs: validate-source
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PRIVATE CODEV source
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.CODEV_SOURCE_REPOSITORY }}
          ref: ${{ inputs.source_ref || 'main' }}
          token: ${{ secrets.CODEV_SOURCE_TOKEN }}
          path: codev-source
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false
      - name: Build Linux CLI
        working-directory: codev-source
        shell: bash
        run: |
          mkdir -p cli/bin
          cd cli
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/CodevCLI-linux-amd64 ./cmd/codev
          cp bin/CodevCLI-linux-amd64 ../CodevCLI-linux-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: codev-cli-linux
          path: codev-source/CodevCLI-linux-amd64
          if-no-files-found: error
          retention-days: 7

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - validate-source
      - build-desktop
      - build-cli-windows
      - build-cli-linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Verify release payload
        shell: bash
        run: |
          test -s release/CodevSetup.exe || { echo "::error::Windows installer missing"; exit 1; }
          test -s release/latest.yml || { echo "::error::electron-updater latest.yml missing"; exit 1; }
          test -s release/CodevCLI.exe || { echo "::error::CLI binary missing"; exit 1; }
          test -s release/CodevCLI-Setup.exe || { echo "::error::CLI installer missing"; exit 1; }
          test -s release/cli-update.json || { echo "::error::CLI update manifest missing"; exit 1; }
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CODEV ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
